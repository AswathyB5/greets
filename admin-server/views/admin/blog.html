<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog - Greets Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" type="image/png" href="/static/greetsfavicon.png">
  <style>
    /* ---- article text editor ---- */
    .rt-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px; background: var(--paper); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; position: sticky; top: 0; z-index: 5; }
    .rt-group { display: inline-flex; gap: 4px; align-items: center; padding-right: 10px; border-right: 1px solid var(--line); }
    .rt-group:last-child { border-right: 0; padding-right: 0; }
    .rt-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; font: inherit; font-size: .85rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; margin: 0; }
    .rt-btn:hover { border-color: var(--lime); }
    .rt-btn.on { background: var(--ok-bg); border-color: var(--lime); color: var(--accent-text); }
    .rt-bar select { width: auto; height: 32px; padding: 0 8px; font-size: .85rem; }
    .rt-colour { position: relative; overflow: hidden; }
    .rt-colour input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
    .rt-a { font-weight: 800; border-bottom: 3px solid #02963c; line-height: 1; }
    .rt-hl { background: #fff59d; padding: 0 3px; font-weight: 700; }
    .rt-bar.source .rt-btn:not([data-cmd="source"]), .rt-bar.source select, .rt-bar.source .rt-colour { opacity: .4; pointer-events: none; }
    .rt-panel { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; background: var(--ok-bg); border: 1px solid var(--line); border-top: 0; font-size: .88rem; }
    .rt-panel label { display: inline-flex; gap: 6px; align-items: center; margin: 0; font-weight: 600; }
    .rt-panel input[type="number"] { width: 64px; padding: 4px 6px; }
    .rt-panel .rt-check input { width: auto; }
    .rt-editor { min-height: 360px; max-height: 720px; overflow: auto; padding: 16px 18px; border: 1px solid var(--line); border-radius: 0 0 var(--radius-md) var(--radius-md); background: #fff; color: #1b2a22; line-height: 1.7; font-size: 1.02rem; }
    .rt-editor:focus { outline: 2px solid var(--lime); outline-offset: -2px; }
    .rt-editor h2 { font-size: 1.45rem; font-weight: 800; color: #02963c; margin: 1.4rem 0 .8rem; padding-bottom: .4rem; border-bottom: 1px solid #E1E7DE; }
    .rt-editor h3 { font-size: 1.2rem; font-weight: 750; margin: 1.2rem 0 .6rem; }
    .rt-editor h4 { font-size: 1.05rem; font-weight: 700; margin: 1rem 0 .5rem; }
    .rt-editor p { margin: 0 0 1rem; }
    .rt-editor a { color: #02963c; text-decoration: underline; font-weight: bold; }
    .rt-editor blockquote { margin: 1rem 0; padding: .6rem 1rem; border-left: 4px solid #02963c; background: #F4F7F2; }
    .rt-editor hr { border: 0; border-top: 1px solid #E1E7DE; margin: 1.5rem 0; }
    .rt-editor img { max-width: 100%; height: auto; border-radius: 8px; }
    .rt-editor table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; }
    .rt-editor th, .rt-editor td { border: 1px solid #c9d3cd; padding: .5rem .7rem; text-align: left; vertical-align: top; min-width: 40px; }
    .rt-editor th { background: #F4F7F2; font-weight: 700; }
    .rt-editor mark { background: #FFF59D; }
    .rt-source { width: 100%; font-family: Consolas, monospace; font-size: .85rem; border-radius: 0 0 var(--radius-md) var(--radius-md); }
  </style>
</head>
<body data-page="blog" data-title="Blog articles">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="backdrop" id="backdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="page-head">
          <h1 id="heading">Blog articles</h1>
          <div class="head-actions" id="head-actions"></div>
        </div>
        <p class="muted" id="intro" style="margin-top:-8px"></p>
        <p class="alert" id="error" role="alert" hidden></p>
        <p class="alert" id="notice" role="status" hidden style="background:var(--ok-bg);color:var(--accent-text)"></p>
        <section class="panel" id="view"></section>
      </main>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script src="/admin/blog-editor.js"></script>
  <script src="/admin/blog.js"></script>
</body>
</html>
